name: Production Build and Deploy

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install || npm ci

      - name: Run Backend Tests (if any)
        working-directory: ./backend
        run: npm test --if-present

      # Deployment Step via SSH
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /home/jntugv-apfrs/htdocs/apfrs.jntugv.in
            git pull origin main
            
            # Build frontend (dist folder will be served by backend)
            npm install
            npm run build
            
            # Clean up the old separate frontend PM2 process if it exists
            pm2 delete apfrs-frontend || true
            
            # Start backend (which now also serves the frontend on port 8001)
            cd backend
            npm install
            PORT=8001 pm2 restart apfrs-backend || PORT=8001 pm2 start server.js --name "apfrs-backend"
